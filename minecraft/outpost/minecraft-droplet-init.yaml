#cloud-config

# Create a non-root user `james` with sudo and a SSH public key.
users:
  - name: james
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDAEgp0wcbFuZuF667AIxDNbbEn2BNr/ofoSrwBHvyhU james@snowy | digital ocean | 2026-06"

# Update and upgrade packages on first boot.
package_update: true
package_upgrade: true

# Install packages. `tmux` hosts the Minecraft server in a detached session so
# its console stays reachable for sending server commands.
packages:
  - ufw
  - default-jdk
  - tmux

# Create a swap file and enable virtual memory.
# Specifically, this creates `/swapfile` with a size of 4GB, allocated by `fallocate`. Then, it runs `mkswap` on it and then `swapon` to enable it. Finally, it adds an entry to `/etc/fstab` so it's re-enabled on reboot
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

# Run commands
runcmd:
  # Pre-create `~/minecraft` for `james`; `scp` uploads the game directory into
  # it later and will not create missing parent directories on its own.
  - install -d -o james -g james /home/james/minecraft
  # Keep `james`'s processes running without an active login session. The tmux
  # server already daemonizes itself, so this is belt-and-suspenders against
  # logind killing user processes when the SSH session that started them ends.
  - loginctl enable-linger james
